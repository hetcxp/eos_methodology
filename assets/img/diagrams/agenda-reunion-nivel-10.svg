<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <linearGradient id="l10Head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <filter id="rowShadow" x="-3%" y="-5%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="820" height="440" rx="14" fill="#F8FAFC"/>
  <rect x="15" y="15" width="790" height="410" rx="10" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="30" y="25" width="760" height="48" rx="8" fill="url(#l10Head)"/>
  <text x="410" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">AGENDA DE LA REUNIÓN SEMANAL NIVEL 10 (L10™) • 90 MINUTOS EXACTOS</text>
  <text x="410" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#99F6E4" text-anchor="middle">Mismo Día • Misma Hora • Empieza a Tiempo • Termina a Tiempo • Mismo Orden Invariable</text>

  <!-- Items list -->
  <!-- 1. Buenas Noticias -->
  <g transform="translate(35, 85)" filter="url(#rowShadow)">
    <rect width="750" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="85" height="38" rx="6" fill="#0F766E"/>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">5 MIN</text>
    <text x="100" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">1. Seg-Buena Noticia (Good News)</text>
    <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">Transición mental: 1 noticia personal y 1 profesional por persona. Crea conexión humana.</text>
  </g>

  <!-- 2. Scorecard -->
  <g transform="translate(35, 128)" filter="url(#rowShadow)">
    <rect width="750" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="85" height="38" rx="6" fill="#0F766E"/>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">5 MIN</text>
    <text x="100" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">2. Revisión del Scorecard</text>
    <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">Revisar 5-15 números. "En objetivo" o "Fuera". Si está fuera, se manda a la Lista de Asuntos (sin debatir).</text>
  </g>

  <!-- 3. Rocas -->
  <g transform="translate(35, 171)" filter="url(#rowShadow)">
    <rect width="750" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="85" height="38" rx="6" fill="#0F766E"/>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">5 MIN</text>
    <text x="100" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">3. Revisión de Rocas (90 Días)</text>
    <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">Cada dueño dice "Encarrilado" o "Descarrilado". Si está descarrilada, va a Asuntos (cero justificaciones).</text>
  </g>

  <!-- 4. Titulares -->
  <g transform="translate(35, 214)" filter="url(#rowShadow)">
    <rect width="750" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="85" height="38" rx="6" fill="#0F766E"/>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">5 MIN</text>
    <text x="100" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">4. Titulares Clientes / Empleados</text>
    <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">Breves novedades o reconocimientos. Si surge una alerta crítica, se anota en la Lista de Asuntos.</text>
  </g>

  <!-- 5. Pendientes -->
  <g transform="translate(35, 257)" filter="url(#rowShadow)">
    <rect width="750" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="85" height="38" rx="6" fill="#0F766E"/>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">5 MIN</text>
    <text x="100" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">5. Lista de Pendientes (To-Dos)</text>
    <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">Tareas de 7 días: "Hecho" o "No Hecho". La meta estándar de cumplimiento semanal es ≥ 90%.</text>
  </g>

  <!-- 6. IDS (Corazón) -->
  <g transform="translate(35, 300)" filter="url(#rowShadow)">
    <rect width="750" height="52" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="85" height="52" rx="6" fill="#0F766E"/>
    <text x="42" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">60 MIN</text>
    <text x="100" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#0F766E">6. IDS™ (Identificar • Discutir • Solucionar)</text>
    <text x="100" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#1E293B">El 67% del tiempo de la reunión. Priorizar los 3 asuntos de mayor impacto (1, 2, 3) y resolver de raíz.</text>
  </g>

  <!-- 7. Conclusión -->
  <g transform="translate(35, 358)" filter="url(#rowShadow)">
    <rect width="750" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="85" height="38" rx="6" fill="#0F766E"/>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">5 MIN</text>
    <text x="100" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">7. Conclusión &amp; Calificación</text>
    <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">Recapitular To-Dos generados, acordar mensajes en cascada y calificar la reunión del 1 al 10 (meta ≥ 8).</text>
  </g>
</svg>
